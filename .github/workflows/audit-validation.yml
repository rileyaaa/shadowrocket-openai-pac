name: Audit hardening regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'data/bitbrowser_domains.txt'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax without modifying checked-in files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for directory in ('scripts', 'tests'):
              for path in sorted(Path(directory).glob('*.py')):
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
      - name: Run all offline regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Verify live upstreams and regenerate both outputs without publication
        run: |
          python - <<'PY' > "$RUNNER_TEMP/before-build.json"
          import hashlib, json
          from pathlib import Path
          def snapshot(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          print(json.dumps({
              'shadow': snapshot('Shadowrocket_Johnshall_AI.conf'),
              'v2rayn': snapshot('v2rayN_Johnshall_AI.json'),
              'shadow_state': json.loads(Path('data/ai-shadowrocket-sources.json').read_text()),
              'v2rayn_state': json.loads(Path('data/v2rayn-sources.json').read_text()),
          }, sort_keys=True))
          PY
          python scripts/build_ai_shadowrocket.py --report-file "$RUNNER_TEMP/shadowrocket-smoke.json"
          python scripts/build_v2rayn.py --report-file "$RUNNER_TEMP/v2rayn-smoke.json"
          python - "$RUNNER_TEMP/before-build.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          before = json.loads(Path(sys.argv[1]).read_text())
          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          sr = json.loads(Path('data/ai-shadowrocket-sources.json').read_text())
          v2 = json.loads(Path('data/v2rayn-sources.json').read_text())
          def same_inputs(old, new):
              return (bool(old.get('build_inputs_sha256'))
                      and old['build_inputs_sha256'] == new.get('build_inputs_sha256')
                      and old['sources'] == new['sources'])
          if same_inputs(before['shadow_state'], sr):
              assert digest('Shadowrocket_Johnshall_AI.conf') == before['shadow'], 'Identical Shadowrocket inputs produced different output'
          if same_inputs(before['v2rayn_state'], v2):
              assert digest('v2rayN_Johnshall_AI.json') == before['v2rayn'], 'Identical v2rayN inputs produced different output'
          sys.path.insert(0, 'scripts')
          from release_integrity import validate_release
          import os
          reports = {'shadowrocket_ai': str(Path(os.environ['RUNNER_TEMP']) / 'shadowrocket-smoke.json'),
                     'v2rayn': str(Path(os.environ['RUNNER_TEMP']) / 'v2rayn-smoke.json')}
          verified = {client: validate_release(client, {'reports': reports}) for client in reports}
          import ai_review_delivery, openai_review_delivery
          openai_audit = openai_review_delivery.prepare(verified)
          assert set(openai_audit['fresh_clients']) == set(reports)
          audit = ai_review_delivery.prepare(verified)
          assert set(audit['fresh_clients']) == set(reports)
          assert Path('data/ai-review-queue.md').is_file()
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          shadow = json.loads(Path('data/ai-shadowrocket-sources.json').read_text())
          v2 = json.loads(Path('data/v2rayn-sources.json').read_text())
          # Builders already enforce mandatory routes and baseline safety limits.
          assert shadow['ai_counts']['claude_domains'] >= 8
          assert shadow['ai_counts']['gemini_domains'] >= 25
          assert v2['statistics']['process_rules'] >= 1
          assert v2['output_sha256']
          assert Path('Shadowrocket_Johnshall_AI.conf').is_file()
          assert Path('v2rayN_Johnshall_AI.json').is_file()
          print('Both live smoke builds passed; artifacts were not committed or published.')
          PY
