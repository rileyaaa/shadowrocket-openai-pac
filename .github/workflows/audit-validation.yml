name: Audit hardening regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax without modifying checked-in files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for directory in ('scripts', 'tests'):
              for path in sorted(Path(directory).glob('*.py')):
                  ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
      - name: Run all offline regression tests
        run: python -B -m unittest discover -s tests -v
