name: Verify live OpenAI evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/verify-evidence.yml'

# This acceptance check cannot publish configs or send notifications. A passing
# production sync may hold old domains; this check requires live evidence.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Require live official evidence and validate all upstreams
        run: python scripts/build.py --require-fresh-network --report-file "$RUNNER_TEMP/evidence-report.json"
