name: Sync Johnshall and OpenAI rules

on:
  workflow_dispatch:
  schedule:
    # Johnshall publishes around 07:04 Asia/Taipei daily.
    # MetaCubeX is the latest regular daily source; recent builds completed around 09:09-10:27.
    # Latest observed finish by 2026-10-12: 10:26:49 Asia/Taipei on 2026-10-06.
    # Schedule roughly 30 minutes later; this is fixed cron, not event-driven.
    # Scheduled at 11:00 Asia/Taipei = 03:00 UTC.
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write

concurrency:
  group: johnshall-openai-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate verified Shadowrocket config
        run: |
          # Use the runner's standard HTTP/2 client for this public HTML source.
          # Keep our real project identity, TLS verification, fixed URL and size
          # limits. No cookies, browser impersonation or third-party mirrors.
          official_status="$(curl --disable --http2 --silent --show-error --fail \
            --proto '=https' --max-time 75 --max-filesize 13000000 \
            --retry 1 --retry-all-errors --retry-delay 2 \
            --user-agent 'shadowrocket-openai-pac/1.0' \
            --header 'Accept: text/html' --header 'Accept-Encoding: identity' \
            --output "$RUNNER_TEMP/official-network.html" --write-out '%{http_code}' \
            'https://help.openai.com/en/articles/9247338-network-recommendations-for-chatgpt-errors-on-web-and-apps')"
          test "$official_status" = '200'
          python scripts/build.py --official-network-file "$RUNNER_TEMP/official-network.html" --report-file "$RUNNER_TEMP/sync-report.json"
      - name: Commit only when upstream changes
        run: |
          git add -A -- Shadowrocket_Johnshall_OpenAI.conf rules data/sources.json data/openai-review.json
          if git diff --cached --quiet; then
            echo "No changes; already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Johnshall and OpenAI rules"
          git push origin HEAD:main
      - name: Telegram report after successful Actions run
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --report-file "$RUNNER_TEMP/sync-report.json"
