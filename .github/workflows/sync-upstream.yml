name: Sync Johnshall, OpenAI, Gemini, Claude and v2rayN rules

on:
  workflow_dispatch:
    inputs:
      reject_rule:
        description: '可选：人工不通过或续期的完整规则；留空只同步'
        required: false
        type: string
      reject_reason:
        description: '不通过原因；填写规则时必填'
        required: false
        type: string
      review_months:
        description: '复审月数（如 6 或 12）；留空保留已有设置或用全局默认'
        required: false
        type: string
  schedule:
    # 11:00 Taiwan = 03:00 UTC; keep one unchanged scheduled workflow.
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - 'data/bitbrowser_domains.txt'
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write

concurrency:
  group: johnshall-openai-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record explicit manual rejection or renew its review date
        if: github.event_name == 'workflow_dispatch' && inputs.reject_rule != ''
        env:
          REVIEW_RULE: ${{ inputs.reject_rule }}
          REVIEW_REASON: ${{ inputs.reject_reason }}
          REVIEW_MONTHS: ${{ inputs.review_months }}
        run: |
          args=(--rule "$REVIEW_RULE" --reason "$REVIEW_REASON")
          if [ -n "$REVIEW_MONTHS" ]; then
            args+=(--months "$REVIEW_MONTHS")
          fi
          python scripts/review_queue.py "${args[@]}"
      - name: Independently build two AI subscriptions (Shadowrocket and v2rayN)
        run: python scripts/run_dual.py --work-dir "$RUNNER_TEMP"
      - name: Publish only validated outputs in one Git push
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dual-status.json" ]; then
            python scripts/publish_dual.py --status-file "$RUNNER_TEMP/dual-status.json"
          else
            echo '::error::Build status missing; refusing publication.'
          fi
      - name: Telegram one combined report and review receipt
        id: telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/notify_combined.py --status-file "$RUNNER_TEMP/dual-status.json" \
            --review-state-file data/review-notifications.json \
            --ai-review-state-file data/ai-review-notifications.json
      - name: Persist delivered review reminders
        if: steps.telegram.outcome == 'success' && github.ref == 'refs/heads/main'
        run: |
          # Telegram success is NOT proof of a successful GitHub publication.
          python - "$RUNNER_TEMP/dual-status.json" <<'PY'
          import json, sys
          state = json.load(open(sys.argv[1], encoding='utf-8'))
          if not state.get('publish', {}).get('success'):
              print('::error::Refusing receipt write after failed publication.')
              sys.exit(1)
          PY
          # A failed publisher may leave unrelated staged files behind.
          # Never let receipt persistence accidentally publish those files.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo '::error::Refusing receipt write outside main.'
            exit 1
          fi
          git reset --mixed --quiet
          git add -- data/review-notifications.json
          if [ -f data/ai-review-notifications.json ]; then
            git add -- data/ai-review-notifications.json
          fi
          while IFS= read -r staged; do
            case "$staged" in
              ''|data/review-notifications.json|data/ai-review-notifications.json) ;;
              *) echo '::error::Unexpected staged path in receipt commit.'; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          if git diff --cached --quiet; then
            echo 'No review receipt changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: record delivered review reminders'
          git push origin HEAD:main
      - name: Propagate independent build and publish failures
        if: always()
        run: python scripts/publish_dual.py --status-file "$RUNNER_TEMP/dual-status.json" --check
