name: Sync Johnshall and OpenAI rules

on:
  workflow_dispatch:
    inputs:
      require_fresh_network:
        description: 'Require live official network evidence (fail instead of holding domains)'
        type: boolean
        default: false
  schedule:
    # Johnshall publishes around 07:04 Asia/Taipei daily.
    # MetaCubeX is the latest regular daily source; recent builds completed around 09:09-10:27.
    # Latest observed finish by 2026-10-12: 10:26:49 Asia/Taipei on 2026-10-06.
    # Schedule roughly 30 minutes later; this is fixed cron, not event-driven.
    # Scheduled at 11:00 Asia/Taipei = 03:00 UTC.
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write

concurrency:
  group: johnshall-openai-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate verified Shadowrocket config
        env:
          REQUIRE_FRESH_NETWORK: ${{ inputs.require_fresh_network == true }}
        run: |
          extra=()
          if [ "$REQUIRE_FRESH_NETWORK" = 'true' ]; then
            extra+=(--require-fresh-network)
          fi
          python scripts/build.py "${extra[@]}" --report-file "$RUNNER_TEMP/sync-report.json"
      - name: Show official evidence status
        run: |
          python - "$RUNNER_TEMP/sync-report.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as source:
              review = json.load(source)["automatic_review"]
          if not review["official_evidence_available"]:
              print("::warning::Domain approvals remain paused: " + review["official_evidence_error"])
          else:
              print("Live official evidence verified; domain approvals are active.")
          PY
      - name: Commit only when upstream changes
        run: |
          git add -A -- Shadowrocket_Johnshall_OpenAI.conf rules data/sources.json data/openai-review.json
          if git diff --cached --quiet; then
            echo "No changes; already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Johnshall and OpenAI rules"
          git push origin HEAD:main
      - name: Telegram report after successful Actions run
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py --report-file "$RUNNER_TEMP/sync-report.json"
