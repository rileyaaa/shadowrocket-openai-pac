name: Sync Johnshall and OpenAI rules

on:
  workflow_dispatch:
  schedule:
    # Johnshall publishes around 07:04 Asia/Taipei daily.
    # MetaCubeX is the latest daily source: recent releases 09:09-10:26.
    # Leave at least an hour after the observed latest upstream completion.
    # Scheduled at 11:30 Asia/Taipei = 03:30 UTC (not event-driven).
    - cron: '30 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write

concurrency:
  group: johnshall-openai-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate verified Shadowrocket config
        run: python scripts/build.py
      - name: Commit only when upstream changes
        run: |
          git add -A -- Shadowrocket_Johnshall_OpenAI.conf rules data/sources.json
          if git diff --cached --quiet; then
            echo "No changes; already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Johnshall and OpenAI rules"
          git push origin HEAD:main
